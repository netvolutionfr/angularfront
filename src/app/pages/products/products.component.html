<h1>Products</h1>

<p-table [value]="products()" [globalFilterFields]="['name']">
  <ng-template pTemplate="header">
    <tr>
      <th>Name</th>
      <th>Price</th>
      <th>Category</th>
      <th>Actions</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-product>
    <tr>
      <td>{{ product.name }}</td>
      <td>{{ product.price | currency }}</td>
      <td>{{ product.category?.name }}</td>
      <td>
        <p-button>Edit</p-button>
        <p-button>Delete</p-button>
      </td>
    </tr>
  </ng-template>
</p-table>
